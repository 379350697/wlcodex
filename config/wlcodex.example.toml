[telegram]
bot_token_env = "WLCODEX_TELEGRAM_BOT_TOKEN"
allowed_user_ids = [123456789]
private_chat_only = true

[codex]
binary = "codex"
app_server_host = "127.0.0.1"
app_server_port = 17431
# Optional: isolate WLCodex's app-server from VS Code's ~/.codex/.tmp cache.
# Populate this home with auth/config/skills/plugins links as needed.
# codex_home = "~/.local/state/wlcodex/codex-home"
approval_policy = "on-request"
sandbox = "workspace-write"

[storage]
sqlite_path = "runtime/wlcodex.sqlite3"
task_log_dir = "runtime/tasks"
# worktree_root must be outside ALL workspaces — otherwise worktree
# creation will pollute workspace git status and block merge preflight.
# Default: ~/.local/state/wlcodex/worktrees
# worktree_root = "/home/wl/.local/state/wlcodex/worktrees"

[display]
status_update_min_interval_seconds = 2
tail_lines = 40
diff_max_chars = 3500

[backend]
startup_timeout_seconds = 15
# JSON-RPC request timeout for individual app-server calls.
request_timeout_seconds = 60
# Codex analysis/verification turn liveness.  Idle timeout is sliding and
# refreshes on matching stream/status/tool/approval events; hard timeout caps
# active planning/verification runtime and excludes human approval wait.
codex_prompt_idle_timeout_seconds = 300
codex_analysis_hard_timeout_seconds = 3600
codex_verification_hard_timeout_seconds = 3600
event_log_max_chars = 20000

[approval]
# Soft age for stale-approval bookkeeping; late callbacks still resolve when
# the task/backend request is alive.
callback_timeout_seconds = 3600
allow_session_approval = true

[task]
max_running_seconds = 7200
max_queued_seconds = 1800
# Waiting approvals are not failed by this timeout; keep for compatibility and
# future soft reminders.
max_waiting_approval_seconds = 3600
watchdog_interval_seconds = 60
backend_dead_grace_seconds = 120

# Live Telegram smoke env vars (for real acceptance gate):
#   WLCODEX_RUN_TELEGRAM_LIVE=1
#   WLCODEX_TELEGRAM_BOT_TOKEN=...
#   WLCODEX_TELEGRAM_ALLOWED_USER_ID=...
# Optional before first real interaction:
#   WLCODEX_LIVE_WORKSPACE_ALIAS=...
#   WLCODEX_LIVE_SQLITE_PATH=...
# Optional after a real Workbench interaction, to pin automated smoke evidence:
#   WLCODEX_TELEGRAM_CHAT_ID=...
#   WLCODEX_LIVE_CONVERSATION_ID=...
# Legacy diagnostic /task approval smoke is manual and is not product release evidence.

[conversation]
enabled = true
# chief_engineer = default Codex -> Claude -> Codex orchestrated workflow
default_mode = "chief_engineer"
default_workspace = "wlcodex"
summary_max_tokens = 800

[orchestration]
# Controls the default Codex -> Claude -> Codex workflow.
enabled = true
max_verify_rounds = 0
auto_delegate_simple_edits = false

[adaptive_team]
enabled = true

[adaptive_team.model_profiles]
codex_gpt = "codex"
claude_deepseek = "claude"

[adaptive_team.assignments]
director = ["codex_gpt"]
investigator = ["codex_gpt"]
architect = ["codex_gpt"]
implementer = ["claude_deepseek", "codex_gpt"]
tester = ["codex_gpt"]
auditor = ["codex_gpt"]

[adaptive_team.role_skills]
investigator = ["systematic-debugging", "gitnexus-exploring"]
architect = ["gitnexus-impact-analysis", "karpathy-guidelines"]
implementer = ["test-driven-development", "verification-before-completion"]
tester = ["test-driven-development", "verification-before-completion"]
auditor = ["github:gh-address-comments", "gitnexus-pr-review"]

[adaptive_team.role_capabilities]
investigator = ["read", "shell_readonly", "logs", "gitnexus"]
architect = ["read", "shell_readonly", "gitnexus"]
implementer = ["read", "write", "shell", "tests"]
tester = ["read", "write_tests", "shell_readonly", "tests"]
auditor = ["read", "git_diff", "shell_readonly", "gitnexus"]

[claude]
# Claude backend for default orchestrated workflow and Claude-only direct mode.
# When disabled, the default Codex -> Claude -> Codex workflow falls back to
# Codex-only; the user can still use 只问 Codex.
enabled = false
binary = "auto"
# Optional override for operators:
#   WLCODEX_CLAUDE_BINARY=/absolute/path/to/claude
startup_timeout_seconds = 15.0
request_timeout_seconds = 3600.0
stream_idle_timeout_seconds = 600.0
# Keep Claude implementation runs on the strongest configured backend profile.
model = "deepseek-v4-pro"
effort = "max"
# Claude permission mode (operator setting).  User-facing switch via /claude_mode:
# 允许编辑 / 自动模式 / 只规划 / 默认确认 / 不询问 / 跳过权限检查
permission_mode = "acceptEdits"

[context_budget]
codex_analysis_tokens = 2500
codex_to_claude_tokens = 1500
claude_to_codex_tokens = 2500
conversation_summary_tokens = 800

[streaming]
enabled = true
edit_min_interval_seconds = 1.0

[interaction]
# natural = quiet chat + same-run streaming (recommended for Cockpit view)
# legacy = task/status-card style for operator workflows
# cockpit = reserved for richer Cockpit view rendering; currently behaves like legacy
profile = "natural"
streaming_enabled = true
show_footer = false
edit_min_interval_seconds = 1.0

[telegram_output]
preview_enabled = true
preview_edit_min_interval_seconds = 2.0
preview_send_timeout_seconds = 5.0
product_body_mode = "final"
terminal_body_mode = "semantic_blocks"
semantic_min_chars = 900
semantic_max_chars = 3200
final_chunk_chars = 3900
terminal_block_idle_seconds = 2.0

[live_stream]
# Local Worker Live Stream web/SSE server. Disabled by default.
# First release is loopback-only; put an authenticated tunnel in front for phone tests.
enabled = false
host = "127.0.0.1"
port = 18731
access_token_env = "WLCODEX_LIVE_STREAM_TOKEN"
allow_unauthenticated_loopback = true

[codex_native]
# Official Codex IDE/mobile-style bridge for the "Codex干活的" station.
enabled = false
transport = "app-server"
listen_endpoint = "ws://127.0.0.1:18742"
# Legacy standalone daemon proxy, only when the official control socket exists:
# transport = "proxy"
# sock_path = "/Users/wl/.codex/app-server-control/app-server-control.sock"

[native_agents]
# Provider-based native web control surface at /native/{provider}.
# Top-level providers are codex, claude, and antigravity.
enabled = false
default_provider = "codex"

[native_agents.codex]
enabled = false

[native_agents.claude]
# Exactly one Claude engine is active at a time:
# - cli-local reuses the local Claude Code login state, including ccswitch routing.
# - sdk-deepseek uses DEEPSEEK_API_KEY first, then the current ccswitch DeepSeek
#   provider credentials.
enabled = false
engine = "cli-local"

[native_agents.claude.cli_local]
binary = "auto"
model = ""
permission_mode = "acceptEdits"

[native_agents.claude.sdk_deepseek]
api_key_env = "DEEPSEEK_API_KEY"
base_url = "https://api.deepseek.com/anthropic"
model = "deepseek-v4-pro"
ccswitch_fallback_enabled = true
ccswitch_db_path = "~/.cc-switch/cc-switch.db"

[native_agents.antigravity]
# SDK provider path. This does not depend on the system-level agy CLI.
enabled = false
engine = "sdk"

# Optional /auto digest rewriting:
# - Default: rule-based local digest only, no network call.
# - Set WLCODEX_DEEPSEEK_API_KEY to enable project-scoped DeepSeek rewriting.
# - Or set WLCODEX_AUTO_DIGEST_LLM=1 with DEEPSEEK_API_KEY.
# - Flash is tried first, Pro is used only if Flash output fails validation.
# - DeepSeek usage is recorded in usage_events with request_kind=telegram_digest.
# Optional model overrides:
#   WLCODEX_AUTO_DIGEST_FLASH_MODEL=deepseek-v4-flash
#   WLCODEX_AUTO_DIGEST_PRO_MODEL=deepseek-v4-pro
#   WLCODEX_AUTO_DIGEST_TIMEOUT_SECONDS=8
#   WLCODEX_AUTO_DIGEST_MAX_INPUT_CHARS=0  # 0 means pass full Codex/Claude output

[menu]
# Register daily-menu commands with Telegram: 新工作台 状态 接管现场 变更 设置 帮助
register_bot_commands = true

# Workspace discovery — optional automatic detection of project directories.
# When enabled, immediate child directories of root that contain .git are
# added as workspaces. Explicit [[workspaces]] entries override discovered
# aliases. Discovery is bounded to immediate children only — no recursion.
[workspace_discovery]
enabled = false
root = "/media/wl/新加卷/codex"
include_git_only = true
allow_write = true
exclude = []

[[workspaces]]
alias = "wlcodex"
path = "/media/wl/新加卷/codex/wlcodex"
allow_write = true

# Additional workspace example entries:
# [[workspaces]]
# alias = "lightfee"
# path = "/media/wl/新加卷/codex/LightFee"
# allow_write = true
#
# [[workspaces]]
# alias = "finance"
# path = "/media/wl/新加卷/codex/Finance"
# allow_write = true
