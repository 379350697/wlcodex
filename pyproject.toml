[project]
name = "wlcodex"
version = "0.1.0"
description = "Personal Telegram cockpit for local Codex CLI on Linux"
requires-python = ">=3.12"
dependencies = [
  "python-telegram-bot>=21,<23",
  "websockets>=12,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]
claude-sdk = [
  "claude-agent-sdk>=0.1",
]
antigravity-sdk = [
  "google-antigravity>=0.1",
]

[project.scripts]
wlcodex = "wlcodex.main:main"
wlcodex-retain-raw-frames = "wlcodex.runtime_raw_frame_retention:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow and not live'"
markers = [
  "slow: slower behavioral tests excluded from the default fast test run",
  "integration: cross-component or subprocess integration tests",
  "live: tests that require live external services or real credentials",
]

[tool.setuptools.packages.find]
include = ["wlcodex*"]
